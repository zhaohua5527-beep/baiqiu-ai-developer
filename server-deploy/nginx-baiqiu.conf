upstream baiqiu_backend {
    server 127.0.0.1:18790;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 850m;
    proxy_request_buffering off;
    root /var/www/baiqiu-website/current;
    index index.html;

    location ^~ /admin {
        proxy_pass http://baiqiu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location ^~ /api/ {
        proxy_pass http://baiqiu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:update\.json|manifest\.json|baiqiu-update\.json|baiqiu-[^/]+\.zip|download/baiqiu-[^/]+-setup\.exe)$ {
        proxy_pass http://baiqiu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
